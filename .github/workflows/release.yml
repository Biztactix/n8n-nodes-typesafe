name: Release

# Publishing is driven by tags only: pushing to main never publishes.
# Release = bump the version in package.json, commit, tag vX.Y.Z, push the tag.
#
# Three jobs, one tarball:
#   build          - verify, lint, build, test, npm pack -> workflow artifact
#   github-release - attaches that tarball to a GitHub Release (manual installs)
#   publish        - STAGES that same tarball on npm (npm stage publish); it only
#                    goes public when Farhan approves the staged version with 2FA
# The GitHub Release does not wait for that approval, so the download is there
# even while (or if never) the staged npm version is approved.
on:
  push:
    tags:
      - 'v*.*.*'

# Least privilege at the workflow level; jobs add only what they need.
permissions:
  contents: read

# Never cancel a release that is already running — a half-cancelled publish is
# worse than a duplicate run, which the registry rejects harmlessly anyway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build and pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      version: ${{ steps.verify.outputs.version }}
      name: ${{ steps.verify.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # One Node version, unlike ci.yml's 20.x/24.x matrix: this job builds the
      # single tarball that ships, and the emitted JS depends on tsc's target,
      # not on the Node that ran it. 24.x is the current LTS and the dev box
      # version; ci.yml already proves the package on the 20.x floor.
      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm

      # Fail before anything is installed, built or published if the tag and the
      # manifest disagree — npm would otherwise happily publish a version nobody
      # tagged. GITHUB_REF_NAME is "v0.1.0"; strip the leading v to compare.
      - name: Verify tag matches package.json version
        id: verify
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} implies version ${tag_version}, but package.json says ${pkg_version}. Bump package.json and re-tag."
            exit 1
          fi
          echo "Releasing ${pkg_version} from tag ${GITHUB_REF_NAME}"
          echo "version=${pkg_version}" >> "$GITHUB_OUTPUT"
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"

      # --ignore-scripts for the same reason as ci.yml: isolated-vm (a transitive
      # dev dependency of n8n-workflow) runs a node-gyp build that is not needed
      # here — this package ships no runtime dependency.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      # npm run build starts with rimraf dist, so the tarball always carries a
      # fresh build of the tagged commit.
      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      # The versioned tarball is what npm gets. The version-less copy exists so
      # releases/latest/download/n8n-nodes-typesafe.tgz is a stable URL that
      # `npm install <url>` can use without knowing the version.
      - name: Pack
        id: pack
        run: |
          set -euo pipefail
          mkdir -p release
          tarball="$(npm pack --pack-destination release --json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8'))[0].filename")"
          cp "release/${tarball}" release/n8n-nodes-typesafe.tgz
          (cd release && sha256sum *.tgz > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"

      - name: Upload tarball
        uses: actions/upload-artifact@v7
        with:
          name: package
          path: release/
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: attach tarball to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Creating a release and uploading assets.
      contents: write
    steps:
      - name: Download tarball
        uses: actions/download-artifact@v8
        with:
          name: package
          path: release

      # No checkout in this job, so gh is told the repo explicitly. If the tag was
      # deleted and re-pushed (README "Releasing"), the release already exists:
      # replace its assets instead of failing.
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARBALL: ${{ needs.build.outputs.tarball }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          base="https://github.com/${GH_REPO}/releases/download/${GITHUB_REF_NAME}"
          cat > notes.md <<EOF
          Build of \`@biztactix/n8n-nodes-typesafe\` ${VERSION} from tag \`${GITHUB_REF_NAME}\`, the same tarball that goes to npm.

          **Manual install** (self-hosted n8n, inside the n8n container):

          \`\`\`sh
          mkdir -p ~/.n8n/nodes && cd ~/.n8n/nodes
          npm install ${base}/${TARBALL} --legacy-peer-deps --ignore-scripts --omit=dev
          \`\`\`

          Then restart n8n (main and workers). Checksums are in \`SHA256SUMS.txt\`.
          EOF
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes-file notes.md \
              --generate-notes
          fi

  publish:
    name: stage on npm (first release publishes)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Apart from the first-ever release (see the last step), this job never makes
    # a version public. It runs `npm stage publish`, which
    # parks the version on the registry, not installable, until Farhan approves
    # it with 2FA (`npm stage approve <stage-id>`, or on npmjs.com). That npm-side
    # approval is the release gate. The `npm` GitHub environment is an optional
    # second gate: give it a required reviewer (repo Settings → Environments) and
    # the job also waits before staging; without one it just runs.
    environment:
      name: npm
      url: https://www.npmjs.com/package/@biztactix/n8n-nodes-typesafe
    permissions:
      contents: read
      # Required for npm provenance: npm exchanges this OIDC token with Sigstore
      # to attest that this tarball was built from this repo at this commit.
      id-token: write
    steps:
      - name: Download tarball
        uses: actions/download-artifact@v8
        with:
          name: package
          path: release

      # registry-url writes the .npmrc auth line that npm reads from
      # NODE_AUTH_TOKEN (the default registry line covers the @biztactix scope).
      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      # `npm stage` arrived during npm 11 (11.16 has it; Node 24.21 bundles
      # 11.19). Fail here, loudly, rather than let an older npm do anything else.
      - name: Check npm supports staged publishing
        run: |
          set -euo pipefail
          echo "npm $(npm --version)"
          if ! npm stage publish --help >/dev/null 2>&1; then
            echo "::error::This npm has no 'npm stage' command; staged publishing needs npm >= 11.16."
            exit 1
          fi

      # Stages the exact file attached to the GitHub Release, so the two downloads
      # share a checksum. Nothing is rebuilt here: no checkout, no lifecycle
      # scripts. --access public is also required by npm for provenance on a
      # scoped package.
      #
      # Staging is the rule: a staged version is not installable until Farhan
      # approves it with 2FA. The one exception is the very first release —
      # `npm stage` requires the package to already exist on the registry, so
      # when `npm view` says E404 the version is published directly, once. Any
      # other `npm view` failure (network, auth) stops the job rather than being
      # mistaken for "does not exist".
      - name: Stage on npm (first-ever release publishes directly)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMPUSH }}
          TARBALL: ${{ needs.build.outputs.tarball }}
          PKG: ${{ needs.build.outputs.name }}
        run: |
          set -euo pipefail
          set +e
          view_out="$(npm view "$PKG" name 2>&1)"
          view_rc=$?
          set -e
          if [ "$view_rc" -eq 0 ]; then
            npm stage publish "release/${TARBALL}" --access public --provenance
            echo "Staged, not published. Approve with: \`npm stage list ${PKG}\` then \`npm stage approve <stage-id>\`" >> "$GITHUB_STEP_SUMMARY"
          elif printf '%s' "$view_out" | grep -q 'E404'; then
            echo "::notice::${PKG} does not exist on npm yet; npm stage cannot create a package, so this first version is published directly."
            npm publish "release/${TARBALL}" --access public --provenance
            echo "First release of ${PKG}: published directly (npm stage needs an existing package). Later releases are staged." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Could not tell whether ${PKG} exists on npm; refusing to guess."
            printf '%s\n' "$view_out"
            exit 1
          fi
